<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Звук</title>
</head>
<body>

<audio id="sound" autoplay>
    <source src="sound.mp3" type="audio/mpeg">
</audio>

<script>
    const audio = document.getElementById("sound");

    audio.play().catch(() => {
        console.log("Браузер заблокировал автоматическое воспроизведение");
    });
</script>

</body>
</html>
